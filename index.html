<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanisch lernen</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#23201c;--mu:#7a746b;--ac:#c8452d;--ac2:#f4d9d2;--ok:#2e7d4f;--okb:#dcf0e3;--ko:#b3261e;--kob:#f8dedb;--bd:#e3ddd3}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#262321;--tx:#f0ebe3;--mu:#a39c91;--ac:#f07a5f;--ac2:#4a2e27;--ok:#6fcf97;--okb:#1f3a2b;--ko:#f28b82;--kob:#472624;--bd:#3a3632}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:16px}
main{max-width:620px;margin:0 auto}
h1{font-size:1.6rem;margin:4px 0 2px}h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 8px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,.chip{font:inherit;color:inherit;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--bd);background:transparent;border-radius:999px;padding:9px 14px;min-height:44px}
.seg button.on,.chip.on{background:var(--ac2);border-color:var(--ac);font-weight:600}
.chip{font-size:.93rem;padding:8px 13px;min-height:40px}
.mini{background:none;border:none;color:var(--ac);padding:4px 8px;font-size:.9rem}
.go{width:100%;background:var(--ac);color:#fff;border:none;border-radius:14px;padding:16px;font-size:1.1rem;font-weight:700;min-height:54px}
.go:disabled{opacity:.4}
.btn{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px 16px;min-height:48px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.92rem;margin-bottom:10px}
.q{text-align:center;padding:28px 12px}
.q .t{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;margin:6px 0}
.q .d{color:var(--mu);font-size:.85rem}
input[type=text]{width:100%;font:inherit;font-size:1.2rem;padding:14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);text-align:center}
input:focus{outline:none;border-color:var(--ac)}
.opts{display:grid;gap:10px}
.opts button{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:14px;font-size:1.1rem;min-height:56px}
.opts button.right{background:var(--okb);border-color:var(--ok)}
.opts button.wrong{background:var(--kob);border-color:var(--ko)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}
.fb small{display:block;font-weight:400;color:var(--tx);margin-top:2px}
.card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;padding:24px;background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:12px}
.card.back{background:var(--ac2);border-color:var(--ac)}
.card .t{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700}
.card .h{color:var(--mu);font-size:.85rem;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two .ko{border-color:var(--ko);color:var(--ko)}.two .ok{border-color:var(--ok);color:var(--ok)}
.end{text-align:center;padding:30px 10px}.end .big{font-size:2.6rem}
.nx{margin-top:12px;width:100%}
</style>
</head>
<body>
<main>
<h1>¡Vamos! <span>Español</span></h1>
<p class="sub">Vokabeln &amp; Verben trainieren</p>
<div id="app"></div>
</main>
<script>
/* ---------- DATEN ---------- */
const PE=[["yo"],["tú"],["él","ella","usted"],["nosotros","nosotras"],["vosotros","vosotras"],["ellos","ellas","ustedes"]];
const PD=[["ich"],["du"],["er","sie","es"],["wir"],["ihr"],["sie","Sie"]];
const CATS=[["ser","Ser"],["tener","Tener"],["trabajar","Trabajar"],["cocinar","Cocinar"],["escuchar","Escuchar"],["hablar","Hablar"],["llamarse","Llamarse"],["estar","Estar"],["zahlen","Zahlen 0–20"],["pron","Personalpronomen"],["poss","Possessivbegleiter"],["u1a","U1 · Primer paso"],["u1b","U1 · Bloque A"],["u2a","U2 · Primer paso"],["u2b","U2 · Bloque A"]];
const D=[];
function verb(c,es,de,tag){es.forEach((f,i)=>{
  D.push({c,es:PE[i].join("/")+" "+f,de:PD[i].join("/")+" "+de[i]+(tag?" ("+tag+")":""),
    ea:PE[i].map(p=>p+" "+f).concat([f]),da:PD[i].map(p=>p+" "+de[i])});});}
verb("ser",["soy","eres","es","somos","sois","son"],["bin","bist","ist","sind","seid","sind"],"ser");
verb("estar",["estoy","estás","está","estamos","estáis","están"],["bin","bist","ist","sind","seid","sind"],"estar");
verb("tener",["tengo","tienes","tiene","tenemos","tenéis","tienen"],["habe","hast","hat","haben","habt","haben"]);
verb("trabajar",["trabajo","trabajas","trabaja","trabajamos","trabajáis","trabajan"],["arbeite","arbeitest","arbeitet","arbeiten","arbeitet","arbeiten"]);
verb("cocinar",["cocino","cocinas","cocina","cocinamos","cocináis","cocinan"],["koche","kochst","kocht","kochen","kocht","kochen"]);
verb("escuchar",["escucho","escuchas","escucha","escuchamos","escucháis","escuchan"],["höre zu","hörst zu","hört zu","hören zu","hört zu","hören zu"]);
verb("hablar",["hablo","hablas","habla","hablamos","habláis","hablan"],["spreche","sprichst","spricht","sprechen","sprecht","sprechen"]);
verb("llamarse",["me llamo","te llamas","se llama","nos llamamos","os llamáis","se llaman"],["heiße","heißt","heißt","heißen","heißt","heißen"]);
"cero uno dos tres cuatro cinco seis siete ocho nueve diez once doce trece catorce quince dieciséis diecisiete dieciocho diecinueve veinte".split(" ").forEach((e,i)=>{
  const w="null eins zwei drei vier fünf sechs sieben acht neun zehn elf zwölf dreizehn vierzehn fünfzehn sechzehn siebzehn achtzehn neunzehn zwanzig".split(" ")[i];
  D.push({c:"zahlen",es:e,de:w+" ("+i+")",ea:[e,e.replace("é","e")],da:[w,String(i)]});});
[["yo","ich"],["tú","du"],["él","er"],["ella","sie (Singular)"],["usted","Sie (formell)"],["nosotros / nosotras","wir"],["vosotros / vosotras","ihr"],["ellos / ellas","sie (Plural)"],["ustedes","ihr / Sie (Lat.-Am. & formell)"]]
.forEach(([e,d])=>D.push({c:"pron",es:e,de:d,ea:e.split(" / "),da:d.includes("(")&&d.startsWith("sie")?[d.split(" ")[0]]:d==="ihr / Sie (Lat.-Am. & formell)"?["ihr","Sie"]:[d.split(" ")[0]]}));
[["mi / mis","mein / meine",["mi","mis"],["mein","meine","meinen"]],
 ["tu / tus","dein / deine",["tu","tus"],["dein","deine","deinen"]],
 ["su / sus (él, ella)","sein / ihr",["su","sus"],["sein","seine","ihr","ihre"]],
 ["nuestro / nuestra / nuestros / nuestras","unser / unsere",["nuestro","nuestra","nuestros","nuestras"],["unser","unsere","unseren"]],
 ["vuestro / vuestra / vuestros / vuestras","euer / eure",["vuestro","vuestra","vuestros","vuestras"],["euer","eure","euren"]],
 ["su / sus (ellos, ellas, ustedes)","ihr / Ihr",["su","sus"],["ihr","ihre","ihren"]]]
.forEach(([e,d,ea,da])=>D.push({c:"poss",es:e,de:d,ea,da}));

/* ---------- HELFER ---------- */
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=s=>s.toLowerCase().replace(/\(.*?\)/g,"").replace(/[.,!?¡¿…;:]/g,"").replace(/\s+/g," ").trim();
const st=s=>nm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const sub=(x,d)=>d==="e"?x.de:x.es;           // Antwort anzeigen
const pr=(x,d)=>d==="e"?x.es:x.de;            // Frage anzeigen
const acc=(x,d)=>d==="e"?x.da:x.ea;


/* ---------- VOKABELN (nur fettgedruckte Wörter) ---------- */
function alts(s){const o=new Set();s.split(";").forEach(p=>{o.add(p);p.split(/[\/,]/).filter(x=>x.trim().length>2).forEach(x=>o.add(x));o.add(p.replace(/\b(etw|jdn)\.?\/?/g,""));
  const m=p.match(/^el\/la (\S+)/);if(m){o.add("el "+m[1]);o.add("la "+m[1])}});return[...o].filter(x=>nm(x))}
function vocab(c,t){t.trim().split("\n").forEach(l=>{const[e,d]=l.split("|").map(x=>x.trim());D.push({c,es:e,de:d,ea:alts(e),da:alts(d)})})}
vocab("u1a",`¡Hola!|Hallo!
¿Qué tal?|Wie geht's?
¡Buenos días!|Guten Morgen!; Guten Tag!
Me llamo...|Ich heiße ...
y|und
Soy...|Ich bin ...
de|von; aus
tú|du
¿Cómo...?|Wie ...?
¿Cómo te llamas?|Wie heißt du?
yo|ich
también|auch
el/la estudiante|der Student/die Studentin; der Schüler/die Schülerin
el profesor/la profesora|der Lehrer/die Lehrerin
el español|Spanisch; die spanische Sprache
pero|aber
vivo|ich lebe; ich wohne
en|in; auf; an
¿Dónde...?|Wo ...?
¿De dónde eres?|Woher kommst du?; Woher bist du?
muy|sehr
bien (adv.)|gut (Adv.)
Gracias.|Danke.; Vielen Dank.
en alemán|auf Deutsch
se dice...|man sagt ...
¡Buenas tardes!|Guten Tag!; Guten Abend!
¡Buenas noches!|Guten Abend!; Gute Nacht!
¡Buenas!|umgangssprachliche Begrüßung
¿Cómo estás?|Wie geht es dir?
vives|du lebst; du wohnst`);
vocab("u1b",`el diálogo|der Dialog; das Gespräch
va con|etw. passt zu; etw. gehört zu
la foto|das Foto
señora|Frau (in der Anrede)
señor|Herr (in der Anrede)
usted, ustedes|Sie
¿Cómo está usted?|Wie geht es Ihnen?
¿Cómo estáis?|Wie geht es euch?
sí|ja
Bueno...|Nun (gut), ...; Also, ...
así así|so einigermaßen; Es geht so.
mucho estrés|viel Stress
pues|also
¡Ánimo!|Kopf hoch!
¡Hasta luego!|Bis später!
¡Adiós!|Auf Wiedersehen!; Tschüs!
Vale.|Einverstanden.; O.K.
el beso|der Kuss
¡Hasta pronto!|Bis bald!
¡Hasta la próxima!|Bis zum nächsten Mal!
¿Cómo están ustedes?|Wie geht es Ihnen?
genial|ausgezeichnet; richtig gut; super; toll
mal (adv.)|schlecht (Adv.)
fatal|(sehr) schlecht
la plaza|der Platz
el estadio|das Stadion
la tapa|die Tapa
el metro|die U-Bahn
el museo|das Museum
el parque|der Park
el símbolo|das Symbol
la calle|die Straße
el chico|der Junge
la chica|das Mädchen
el problema|das Problem
el amigo/la amiga|der Freund/die Freundin
el teléfono|das Telefon
la playa|der Strand
el restaurante|das Restaurant
la guitarra|die Gitarre
el bar|die Bar; die Kneipe
Se escribe...|Man schreibt ...; ... wird ... geschrieben.
tu|dein/deine
el nombre|der Name
el apellido|der Nachname
con|mit
con dos puntos (en la a/o/u)|mit Umlaut
o|oder
el acento|der Akzent
la capital|die Hauptstadt
¿Cuántos años tienes?|Wie alt bist du?
Tengo... años.|Ich bin ... Jahre alt.
es|er/sie/es ist
el número de teléfono|die Telefonnummer
¿Cuál es tu número de teléfono?|Wie lautet deine Telefonnummer?
el móvil|das Handy
mi|mein, meine
la dirección|die Adresse
el correo electrónico|die E-Mail
la arroba|das At-Zeichen (@)
el punto|der Punkt
el guion|der Bindestrich
el guion bajo|der Unterstrich`);
vocab("u2a",`la familia|die Familie
mis|meine (Pl.)
el perro|der Hund
el padre|der Vater
la madre|die Mutter
el hermano/la hermana|der Bruder/die Schwester
la ciudad|die Stadt
el novio/la novia|der feste Freund/die feste Freundin
el mejor amigo/la mejor amiga|der beste Freund/die beste Freundin
el compañero de clase/la compañera de clase|der Klassenkamerad/die Klassenkameradin
Se llama...|Er/sie/es heißt ...
tiene|er, sie, es hat; Sie haben
¿Cómo se llama...?|Wie heißt ...?
la mascota|das Haustier
¿Tienes...?|Hast du ...?
tengo|ich habe
no|nein; kein, -e; nicht
los hermanos|die Geschwister`);
vocab("u2b",`¿Verdad?|Das stimmt doch, oder?; ..., nicht wahr?
¿Quién...?/¿Quiénes...?|Wer ...?
ser (irr.)|sein
el abuelo/la abuela|der Großvater/die Großmutter
el tío|der Onkel
la tía|die Tante
el primo/la prima|der Cousin/die Cousine
los padres|die Eltern
los abuelos (pl.)|die Großeltern
hablar|sprechen; reden
el idioma|die Sprache
el inglés|Englisch; die englische Sprache
el catalán|Katalanisch; die katalanische Sprache
trabajar|arbeiten
el instituto|das Gymnasium
el hijo|der Sohn
la hija|die Tochter
los hijos (pl.)|die Kinder
todos los días|jeden Tag
el ingeniero/la ingeniera|der Ingenieur/die Ingenieurin
el alemán|Deutsch; die deutsche Sprache
la pareja|der Partner/die Partnerin; der Lebensgefährte/die Lebensgefährtin
el fotógrafo/la fotógrafa|der Fotograf/die Fotografin
cocinar algo|etw. kochen
siempre|immer
escuchar algo/a alguien|etw./jdn hören
la música|die Musik
estudiar|lernen; studieren
un poco (de)|ein bisschen
el francés|Französisch; die französische Sprache
pasar algo|etw. verbringen
las vacaciones|die Ferien; der Urlaub
el verano|der Sommer
solo|nur
el gato|die Katze
No es correcto.|Das ist nicht richtig.; Das stimmt nicht.
su|sein, -e; ihr, -e; Ihr, -e
tus|deine (Pl.)
sus|seine; ihre; Ihre
¿Qué...?|Welche, -r, -s ...?; Was für ein, -e ...?
la persona|die Person
la casa|das Haus
en casa|zu Hause`);

/* ---------- ZUSTAND ---------- */
let mode="write",dir="e",sel=new Set(CATS.map(c=>c[0])),deck=[],ok=0,bad=0,total=0,cur=null,done=false,flip=false;

function setup(){
  $("#app").innerHTML=`
  <div class="box"><p class="lbl">Modus</p><div class="seg" id="m">
    <button data-v="write" class="${mode=="write"?"on":""}">✍️ Schreiben</button>
    <button data-v="choice" class="${mode=="choice"?"on":""}">🔘 Auswahl (4)</button>
    <button data-v="cards" class="${mode=="cards"?"on":""}">🗂️ Karteikarten</button></div></div>
  <div class="box"><p class="lbl">Richtung</p><div class="seg" id="d">
    <button data-v="e" class="${dir=="e"?"on":""}">Spanisch → Deutsch</button>
    <button data-v="d" class="${dir=="d"?"on":""}">Deutsch → Spanisch</button>
    <button data-v="mix" class="${dir=="mix"?"on":""}">Gemischt</button></div></div>
  <div class="box"><p class="lbl">Themen <button class="mini" id="all">alle</button><button class="mini" id="none">keine</button></p>
    <div class="row" id="c">${CATS.map(([k,l])=>`<button class="chip ${sel.has(k)?"on":""}" data-v="${k}">${l}</button>`).join("")}</div></div>
  <button class="go" id="go" ${sel.size?"":"disabled"}>Los geht's (${D.filter(x=>sel.has(x.c)).length} Karten)</button>`;
  const seg=(id,fn)=>$(id).onclick=e=>{const b=e.target.closest("button");if(b){fn(b.dataset.v);setup()}};
  seg("#m",v=>mode=v);seg("#d",v=>dir=v);
  seg("#c",v=>sel.has(v)?sel.delete(v):sel.add(v));
  $("#all").onclick=()=>{CATS.forEach(c=>sel.add(c[0]));setup()};
  $("#none").onclick=()=>{sel.clear();setup()};
  $("#go").onclick=start;
}

function start(){
  deck=sh(D.filter(x=>sel.has(x.c))).map(x=>({x,d:dir=="mix"?(Math.random()<.5?"e":"d"):dir}));
  ok=bad=0;total=deck.length;done=false;next();
}
function bar(){return `<div class="top"><span>Noch ${deck.length} · ✓ ${ok} · ✗ ${bad}</span><button class="mini" onclick="setup()">Beenden</button></div>`}
function next(){
  if(!deck.length){
    $("#app").innerHTML=`<div class="box end"><div class="big">🎉</div><h2>Geschafft!</h2><p>${total} Karten durch · ${bad} Fehler</p><button class="go" onclick="setup()">Zurück zum Menü</button></div>`;return}
  cur=deck[0];done=false;flip=false;
  mode=="write"?qWrite():mode=="choice"?qChoice():qCard();
}
function again(ok_){ // Karte abschließen
  deck.shift();
  if(ok_)ok++;else{bad++;deck.splice(Math.min(deck.length,3+(Math.random()*3|0)),0,cur)}
}
function qBox(){return `${bar()}<div class="box q"><div class="d">${cur.d=="e"?"Spanisch → Deutsch":"Deutsch → Spanisch"}</div><div class="t">${pr(cur.x,cur.d)}</div></div>`}

/* Schreiben */
function qWrite(){
  $("#app").innerHTML=qBox()+`<input type="text" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben…"><div id="fb"></div><button class="go nx" id="chk" style="margin-top:12px">Prüfen</button>`;
  $("#in").focus();$("#chk").onclick=act;
}
function act(){
  if(mode!="write")return;
  if(done){next();return}
  const v=$("#in").value;if(!v.trim())return;
  const a=acc(cur.x,cur.d),exact=a.some(s=>nm(s)==nm(v)),loose=!exact&&a.some(s=>st(s)==st(v));
  done=true;$("#in").disabled=true;
  const good=exact,solution=sub(cur.x,cur.d);
  $("#fb").innerHTML=exact?`<div class="fb ok">✓ Richtig!</div>`:loose?`<div class="fb ko">✗ Falsch – Akzent beachten!<small>Richtig: ${solution}</small></div>`:`<div class="fb ko">✗ Falsch<small>Richtig: ${solution}</small></div>`;
  again(good);$("#chk").textContent="Weiter";
  $(".top span").textContent=`Noch ${deck.length} · ✓ ${ok} · ✗ ${bad}`;
}

/* Auswahl */
function qChoice(){
  const d=cur.d,right=sub(cur.x,d);
  const pool=[...new Set(D.filter(y=>y!==cur.x&&sub(y,d)!==right).map(y=>sub(y,d)))];
  const same=[...new Set(D.filter(y=>y!==cur.x&&y.c==cur.x.c&&sub(y,d)!==right).map(y=>sub(y,d)))];
  let o=sh(same).slice(0,3);
  o=o.concat(sh(pool.filter(p=>!o.includes(p))).slice(0,3-o.length));
  o=sh(o.concat(right));
  $("#app").innerHTML=qBox()+`<div class="opts">${o.map(t=>`<button>${t}</button>`).join("")}</div><div id="fb"></div>`;
  document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const g=b.textContent==right;
    document.querySelectorAll(".opts button").forEach(x=>{if(x.textContent==right)x.classList.add("right")});
    if(!g)b.classList.add("wrong");
    again(g);
    $(".top span").textContent=`Noch ${deck.length} · ✓ ${ok} · ✗ ${bad}`;
    $("#fb").innerHTML=`<button class="go nx" id="nx">Weiter</button>`;$("#nx").onclick=next;
  });
}

/* Karteikarten */
function qCard(){
  const front=pr(cur.x,cur.d),back=sub(cur.x,cur.d);
  $("#app").innerHTML=bar()+`<div class="card ${flip?"back":""}" id="cd"><div class="t">${flip?back:front}</div><div class="h">${flip?"Antwort":"Tippen zum Umdrehen"}</div></div>`+
   (flip?`<div class="two"><button class="btn ko" id="k">Nochmal</button><button class="btn ok" id="w">Gewusst</button></div>`:"");
  $("#cd").onclick=()=>{flip=!flip;qCard()};
  if(flip){$("#k").onclick=()=>{again(false);next()};$("#w").onclick=()=>{again(true);next()}}
}

document.addEventListener("keydown",e=>{
  if(e.key=="Enter"){if(mode=="write"&&$("#in"))act();else if(done&&$("#nx"))next()}
  if(e.key==" "&&mode=="cards"&&$("#cd")&&document.activeElement.tagName!="INPUT"){e.preventDefault();flip=!flip;qCard()}
});
setup();
</script>
</body>
</html>
